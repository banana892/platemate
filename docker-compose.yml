version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: platemate-postgres
    restart: always
    environment:
      POSTGRES_USER: platemate_user
      POSTGRES_PASSWORD: platemate_password
      POSTGRES_DB: platemate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platemate_user -d platemate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: platemate-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platemate-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://platemate_user:platemate_password@postgres:5432/platemate?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "change_me_to_a_secure_production_access_secret_min_32_chars"
      JWT_REFRESH_SECRET: "change_me_to_a_secure_production_refresh_secret_min_32_chars"
      CLIENT_URL: "http://localhost"
      ALLOWED_ORIGINS: "http://localhost,http://localhost:80"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET}"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:5000/api/v1"
        VITE_SOCKET_URL: "http://localhost:5000"
    container_name: platemate-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
