name: PlateMate CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  verify:
    name: Verify Codebase & Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies (Backend & Frontend)
        run: |
          npm run install:all

      - name: Prisma Validate & Client Generation
        run: |
          cd backend
          npx prisma validate --config prisma.config.ts
          npm run db:generate

      - name: Run Frontend Linting (oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Run Backend Syntax Check
        run: |
          cd backend
          node --check src/server.js
          node --check src/app.js

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: "https://api.platemate.local/api/v1"

      - name: Verify Build Artifacts
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          echo "✅ Production build verified successfully!"
